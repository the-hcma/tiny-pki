# Release Please turns a merged release PR into the vX.Y.Z tag and GitHub
# release, then publishes to PyPI through trusted publishing. The release PR
# itself is opened by hand (org policy stops Actions from creating PRs); see
# RELEASING.md.

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish (e.g. 0.1.0). Must match pyproject.toml on main.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  publish-pypi:
    needs: release-please
    if: |
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.version != '')
      )
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    outputs:
      published_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19" # bump deliberately; see SECURITY.md

      - name: Read package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [[ -n "$INPUT_VERSION" && "$version" != "$INPUT_VERSION" ]]; then
            echo "ERROR: Input version '$INPUT_VERSION' does not match pyproject.toml version '$version'." >&2
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Python lint & format checks
        run: bash .github/ci/python-static

      - name: Pytest (hermetic)
        run: bash .github/ci/pytest-hermetic

      - name: Build distributions
        env:
          TINY_PKI_EMBED_VERSION: ${{ steps.version.outputs.version }}
          TINY_PKI_EMBED_COMMIT: ${{ github.sha }}
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  smoke-test:
    name: Post-publish smoke test (pipx)
    needs: publish-pypi
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.publish-pypi.outputs.published_version }}
    steps:
      - name: Wait for PyPI
        shell: bash
        run: |
          for i in $(seq 1 18); do
            if curl -fsSL "https://pypi.org/pypi/tiny-pki/json" \
              | jq -e --arg v "$VERSION" '.releases[$v] != null' >/dev/null; then
              echo "Package available on PyPI."
              exit 0
            fi
            echo "Attempt $i: waiting for tiny-pki==${VERSION}..."
            sleep 10
          done
          echo "Package did not become available in time." >&2
          exit 1

      - name: pipx install, --version and --help
        shell: bash
        run: |
          python3 -m pip install --user pipx
          export PATH="$HOME/.local/bin:$PATH"
          pipx install "tiny-pki[cli]==${VERSION}"
          output=$(tiny-pki --version)
          echo "$output"
          echo "$output" | grep -qE "^tiny-pki ${VERSION//./\\.} \([0-9a-f]+\)$"
          tiny-pki --help | grep -q "usage:"
